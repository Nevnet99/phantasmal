name: Release

# Manual publish: Actions → Release → Run workflow
# Optional: push a tag like v0.0.2 (must match apps/desktop/package.json version)
#
# Matrix builds always upload assets to a *draft* GitHub Release (so incomplete
# multi-OS uploads stay private). A follow-up job then publishes the release
# unless you opted into draft mode. After that, site download images sync into
# apps/marketing/public/downloads/ (Git LFS) and a PR is opened for /download.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to ship (e.g. 0.0.2). Leave blank to use package.json as-is."
        required: false
        type: string
      draft:
        description: "Leave the GitHub Release as a draft (skips publish + site download PR)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      draft: ${{ steps.ver.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PKG="apps/desktop/package.json"
          INPUT="${{ github.event.inputs.version || '' }}"
          if [[ -n "$INPUT" ]]; then
            VERSION="${INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./${PKG}').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          DRAFT="${{ github.event.inputs.draft || 'false' }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Shipping $VERSION (draft=$DRAFT)"

  release:
    name: Build & publish (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync package.json version
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
          "
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Install
        run: bun install --frozen-lockfile

      # Always draft while the matrix is uploading — parallel OS jobs must not
      # publish a half-complete release. finalize-release undrafts afterward.
      - name: Build & upload (draft release)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          bunx electron-builder --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  finalize-release:
    name: Publish GitHub Release
    needs: [version, release]
    if: ${{ success() && needs.version.outputs.draft != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "Publishing ${TAG}…"
          gh release view "$TAG" --json isDraft,url,assets --jq '{isDraft,url,assetCount:(.assets|length),assets:[.assets[].name]}'
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft,isLatest,url --jq .

  sync-site-downloads:
    name: PR site download images
    needs: [version, finalize-release]
    if: ${{ success() && needs.version.outputs.draft != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Git LFS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Sync installers into marketing/public/downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bun scripts/sync-site-downloads.ts --version "$VERSION" --repo "${{ github.repository }}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(marketing): sync download images for v${{ needs.version.outputs.version }}"
          branch: "chore/site-downloads-v${{ needs.version.outputs.version }}"
          delete-branch: true
          title: "chore(marketing): site downloads for v${{ needs.version.outputs.version }}"
          body: |
            ## Summary
            - Sync Linux / macOS / Windows installers into `apps/marketing/public/downloads/` (Git LFS)
            - Refresh `manifest.json` so `/download` serves the builds for the visitor’s OS

            Generated by the **Release** workflow after publishing **v${{ needs.version.outputs.version }}**.

            ## Test plan
            - [ ] PR shows LFS pointers for AppImage / DMG / EXE
            - [ ] `/download` primary CTA matches your OS after merge + deploy
            - [ ] Other platform links still work
          labels: |
            marketing
            automated
