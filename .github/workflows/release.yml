name: Release

# Manual publish: Actions → Release → Run workflow
# Optional: push a tag like v0.0.2 (must match package.json version)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to ship (e.g. 0.0.2). Leave blank to use package.json as-is."
        required: false
        type: string
      draft:
        description: "Publish as a draft GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version || '' }}"
          if [[ -n "$INPUT" ]]; then
            VERSION="${INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Shipping $VERSION"

      - name: Sync package.json version
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build & publish
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          EXTRA=()
          if [[ "${{ github.event.inputs.draft || 'false' }}" == "true" ]]; then
            EXTRA+=(-c.publish.releaseType=draft)
          fi
          bunx electron-builder --publish always "${EXTRA[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned mac builds are fine for personal/GitHub Releases until you add Apple certs.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
